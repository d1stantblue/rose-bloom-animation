<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Lily Bouquet - Blooming</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050507;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
      cursor: pointer;
    }
    canvas { display: block; }
    .hint {
      position: fixed;
      bottom: 16px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="asciiCanvas"></canvas>
  <div class="hint">[ click anywhere to replay bloom ]</div>

  <script>
    const canvas = document.getElementById("asciiCanvas");
    const ctx = canvas.getContext("2d");
    const buffer = document.createElement("canvas");
    const bctx = buffer.getContext("2d", { willReadFrequently: true });

    const ASCII_CHARS = " .,:;-=+*#%@";
    const CELL_SIZE = 6;
    let width = 0, height = 0, startTime = performance.now();

    function resize() {
      width = canvas.width = buffer.width = Math.floor(Math.min(window.innerWidth, 800));
      height = canvas.height = buffer.height = Math.floor(Math.min(window.innerHeight, 900));
    }
    window.addEventListener("resize", resize);
    window.addEventListener("click", () => { startTime = performance.now(); });
    resize();

    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

    const bouquet = [
      { x: 0.50, y: 0.17, scale: 0.35, rot: 0.00, delay: 0.2, colors: ["#5a1828", "#a8324a", "#f29cb0"], bud: true },
      { x: 0.64, y: 0.22, scale: 0.45, rot: 0.40, delay: 0.4, colors: ["#6b5a14", "#d4b83b", "#fff5a8"], bud: true },
      { x: 0.36, y: 0.23, scale: 0.52, rot: -0.40, delay: 0.3, colors: ["#7a5c58", "#d9c5c1", "#ffffff"], bud: false },
      { x: 0.50, y: 0.29, scale: 0.85, rot: 0.10, delay: 0.6, colors: ["#590811", "#d61c2e", "#ff7a85"], bud: false },
      { x: 0.68, y: 0.36, scale: 0.72, rot: 0.50, delay: 0.8, colors: ["#4a0d29", "#a6245e", "#f075ab"], bud: false },
      { x: 0.33, y: 0.36, scale: 0.72, rot: -0.50, delay: 0.7, colors: ["#755308", "#e0a819", "#ffe875"], bud: false },
      { x: 0.41, y: 0.46, scale: 0.90, rot: -0.25, delay: 1.0, colors: ["#6e1248", "#db449c", "#ffc2e5"], bud: false },
      { x: 0.59, y: 0.48, scale: 0.92, rot: 0.25, delay: 1.1, colors: ["#6e5c52", "#d6c8be", "#ffffff"], bud: false },
      { x: 0.30, y: 0.58, scale: 0.62, rot: -0.70, delay: 1.3, colors: ["#66520a", "#d9b526", "#fff29c"], bud: false },
      { x: 0.70, y: 0.60, scale: 0.58, rot: 0.75, delay: 1.4, colors: ["#590811", "#bd1928", "#ff6b78"], bud: false },
      { x: 0.48, y: 0.61, scale: 0.95, rot: 0.05, delay: 1.2, colors: ["#7a4326", "#e09f70", "#fff4eb"], bud: false }
    ];

    function quadPt(t, p0, p1, p2) {
      const inv = 1 - t;
      return inv * inv * p0 + 2 * inv * t * p1 + t * t * p2;
    }

    function drawStem(tx, ty, bx, by, sway, prog) {
      if (prog <= 0) return { tipX: bx, tipY: by };
      const fcx = (tx + bx) / 2 + sway * 18, fcy = (ty + by) / 2;
      const tipX = quadPt(prog, bx, fcx, tx), tipY = quadPt(prog, by, fcy, ty);
      const ccx = (tipX + bx) / 2 + sway * 18 * prog, ccy = (tipY + by) / 2;

      bctx.beginPath();
      bctx.moveTo(bx, by);
      bctx.quadraticCurveTo(ccx, ccy, tipX, tipY);
      bctx.strokeStyle = "#2d7a36";
      bctx.lineWidth = 5;
      bctx.stroke();

      bctx.beginPath();
      bctx.moveTo(bx + 1.5, by);
      bctx.quadraticCurveTo(ccx + 1.5, ccy, tipX + 1.5, tipY);
      bctx.strokeStyle = "#68c46c";
      bctx.lineWidth = 2;
      bctx.stroke();

      const leafG = easeOut(clamp01((prog - 0.5) / 0.5));
      if (leafG > 0) {
        const lx = quadPt(0.55, bx, fcx, tx), ly = quadPt(0.55, by, fcy, ty);
        const dir = tx < bx ? -1 : 1;
        bctx.save();
        bctx.translate(lx, ly);
        bctx.rotate(dir * (0.2 + 0.45 * leafG) + sway * 0.1);
        bctx.scale(leafG, leafG);
        bctx.beginPath();
        bctx.moveTo(0, 0);
        bctx.quadraticCurveTo(dir * 35, -18, dir * 70, 5);
        bctx.quadraticCurveTo(dir * 35, 14, 0, 0);
        const lg = bctx.createLinearGradient(0, 0, dir * 70, 0);
        lg.addColorStop(0, "#1b4d22");
        lg.addColorStop(0.6, "#3ca347");
        lg.addColorStop(1, "#8ce089");
        bctx.fillStyle = lg;
        bctx.fill();
        bctx.restore();
      }
      return { tipX, tipY };
    }

    function drawPetal(len, wid, colors, open) {
      const [c1, c2, c3] = colors;
      const w = wid * (0.45 + 0.55 * open), l = len * (0.75 + 0.25 * open);
      const grad = bctx.createLinearGradient(0, 0, 0, -l);
      grad.addColorStop(0, c1);
      grad.addColorStop(0.45, c2);
      grad.addColorStop(1, c3);

      bctx.beginPath();
      bctx.moveTo(0, 0);
      bctx.bezierCurveTo(-w, -l * 0.3, -w * 0.85, -l * 0.78, 0, -l);
      bctx.bezierCurveTo(w * 0.85, -l * 0.78, w, -l * 0.3, 0, 0);
      bctx.fillStyle = grad;
      bctx.fill();

      bctx.beginPath();
      bctx.moveTo(0, -4);
      bctx.lineTo(0, -l * 0.88);
      bctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
      bctx.lineWidth = 1.5;
      bctx.stroke();

      if (open > 0.3) {
        bctx.fillStyle = `rgba(35, 5, 10, ${0.55 * open})`;
        for (let i = 0; i < 7; i++) {
          const sx = (((i * 7) % 11) - 5) * (w * 0.06);
          const sy = -l * (0.16 + (i % 4) * 0.07);
          bctx.beginPath();
          bctx.arc(sx, sy, 1.4, 0, Math.PI * 2);
          bctx.fill();
        }
      }
    }

    function drawLily(x, y, scale, rot, colors, isBud, sway, budG, open) {
      if (budG <= 0) return;
      bctx.save();
      bctx.translate(x, y);
      bctx.rotate(rot * (0.25 + 0.75 * open) + sway * 0.05);
      const s = scale * budG * (0.38 + 0.62 * open);
      bctx.scale(s, s);

      if (isBud) {
        for (let i = -1; i <= 1; i++) {
          bctx.save();
          bctx.rotate(i * (0.08 + 0.14 * open));
          drawPetal(85, 22, colors, open * 0.4);
          bctx.restore();
        }
        bctx.restore();
        return;
      }

      const back = [-Math.PI / 3, Math.PI / 3, Math.PI];
      const front = [0, (2 * Math.PI) / 3, -(2 * Math.PI) / 3];

      back.forEach((target, i) => {
        bctx.save();
        const start = (i - 1) * 0.14;
        bctx.rotate(start + (target - start) * open);
        drawPetal(92, 26, colors, open);
        bctx.restore();
      });

      front.forEach((target, i) => {
        bctx.save();
        const start = (i - 1) * 0.10;
        bctx.rotate(start + (target - start) * open);
        drawPetal(98, 29, colors, open);
        bctx.restore();
      });

      const sp = easeOut(clamp01((open - 0.45) / 0.55));
      if (sp > 0) {
        for (let i = 0; i < 6; i++) {
          const a = (i * Math.PI) / 3 + 0.2;
          const sx = Math.cos(a) * 24 * sp, sy = Math.sin(a) * 24 * sp;
          bctx.beginPath();
          bctx.moveTo(0, 0);
          bctx.quadraticCurveTo(sx * 0.5, sy * 0.5 - 6 * sp, sx, sy);
          bctx.strokeStyle = "#d9e89c";
          bctx.lineWidth = 1.5;
          bctx.stroke();

          bctx.fillStyle = "#8a2b13";
          bctx.beginPath();
          bctx.ellipse(sx, sy, 4 * sp, 2 * sp, a, 0, Math.PI * 2);
          bctx.fill();
        }
      }
      bctx.restore();
    }

    function render(now) {
      const elapsed = (now - startTime) / 1000;
      const swayTime = now * 0.0015;
      bctx.fillStyle = "#000000";
      bctx.fillRect(0, 0, width, height);

      const bx = width * 0.5, by = height * 0.84;
      const states = bouquet.map((f, idx) => {
        const lt = Math.max(0, elapsed - f.delay);
        const stemP = easeInOut(clamp01(lt / 1.1));
        const budG = easeOut(clamp01((lt - 0.7) / 0.6));
        const open = easeOut(clamp01((lt - 1.1) / 1.5));
        const sway = Math.sin(swayTime + idx * 0.4) * stemP;
        return { f, stemP, budG, open, sway };
      });

      const tips = states.map((s) => drawStem(width * s.f.x, height * s.f.y, bx, by, s.sway, s.stemP));
      states.forEach((s, i) => {
        drawLily(tips.at(i).tipX, tips.at(i).tipY, s.f.scale, s.f.rot, s.f.colors, s.f.bud, s.sway, s.budG, s.open);
      });

      const data = bctx.getImageData(0, 0, width, height).data;
      ctx.fillStyle = "#050507";
      ctx.fillRect(0, 0, width, height);
      ctx.font = `bold ${CELL_SIZE + 2}px monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (let y = 0; y < height; y += CELL_SIZE) {
        for (let x = 0; x < width; x += CELL_SIZE) {
          const i = (y * width + x) * 4;
          const r = data.at(i), g = data.at(i + 1), b = data.at(i + 2);
          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          if (lum > 0.05) {
            const ci = Math.min(ASCII_CHARS.length - 1, Math.floor(lum * ASCII_CHARS.length));
            ctx.fillStyle = `rgb(${Math.min(255, r * 1.15)}, ${Math.min(255, g * 1.15)}, ${Math.min(255, b * 1.15)})`;
            ctx.fillText(ASCII_CHARS.at(ci), x + CELL_SIZE / 2, y + CELL_SIZE / 2);
          }
        }
      }
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
