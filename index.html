<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipe Cleaner Rose Bouquet - Blooming</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050507;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: monospace;
      cursor: pointer;
    }
    canvas { display: block; }
    .hint {
      position: fixed;
      bottom: 16px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="asciiCanvas"></canvas>
  <div class="hint">[ click to replay bloom · space to toggle ASCII / smooth ]</div>

  <script>
    const canvas = document.getElementById("asciiCanvas");
    const ctx = canvas.getContext("2d");
    const buffer = document.createElement("canvas");
    const bctx = buffer.getContext("2d", { willReadFrequently: true });

    const ASCII_CHARS = " .,:;-=+*#%@";
    const CELL = 5;
    let width = 0, height = 0, startTime = performance.now();
    let asciiMode = true;

    function resize() {
      width = canvas.width = buffer.width = Math.floor(Math.min(window.innerWidth, 800));
      height = canvas.height = buffer.height = Math.floor(Math.min(window.innerHeight, 900));
    }
    window.addEventListener("resize", resize);
    window.addEventListener("click", () => { startTime = performance.now(); });
    window.addEventListener("keydown", (e) => { if (e.code === "Space") { asciiMode = !asciiMode; e.preventDefault(); } });
    resize();

    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
    const easeOutBack = (t) => { const c = 1.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

    // body = [centre-side, mid, outer edge]; rim = fuzzy edge colour
    const PAL = {
      pink:  { body: ["#6e1a38", "#a8386a", "#e07aa0"], rim: "#f2b8cc", core: "#3d0a1e" },
      red:     { body: ["#3f0610", "#8a0f22", "#c92d44"], rim: "#e0707e", core: "#240308" },
      crimson: { body: ["#2a040a", "#5e0a18", "#992036"], rim: "#b84a5c", core: "#150205" },
      hotpink: { body: ["#5e1038", "#a22a6a", "#d86a9e"], rim: "#eeaccd", core: "#34061f" },
      blush:   { body: ["#9a5068", "#c97c98", "#eab0c4"], rim: "#f6d6e0", core: "#6a2a42" }
    };

    // Dense dome of roses
    const bouquet = [
      { x: 0.50, y: 0.15, size: 0.60, rot: 0.1, tilt: 0.85, delay: 0.2, pal: "red" },
      { x: 0.37, y: 0.20, size: 0.62, rot: 0.5, tilt: 0.82, delay: 0.3, pal: "blush" },
      { x: 0.63, y: 0.20, size: 0.62, rot: 0.2, tilt: 0.82, delay: 0.4, pal: "hotpink" },
      { x: 0.26, y: 0.27, size: 0.64, rot: 0.9, tilt: 0.85, delay: 0.5, pal: "red" },
      { x: 0.50, y: 0.26, size: 0.78, rot: 0.3, tilt: 0.92, delay: 0.6, pal: "pink" },
      { x: 0.74, y: 0.27, size: 0.64, rot: 0.6, tilt: 0.85, delay: 0.7, pal: "crimson" },
      { x: 0.37, y: 0.34, size: 0.78, rot: 0.0, tilt: 0.94, delay: 0.8, pal: "hotpink" },
      { x: 0.63, y: 0.34, size: 0.78, rot: 0.7, tilt: 0.92, delay: 0.9, pal: "red" },
      { x: 0.19, y: 0.38, size: 0.60, rot: 0.4, tilt: 0.85, delay: 1.0, pal: "blush" },
      { x: 0.50, y: 0.42, size: 0.84, rot: 0.2, tilt: 0.96, delay: 1.1, pal: "red" },
      { x: 0.81, y: 0.38, size: 0.60, rot: 0.8, tilt: 0.85, delay: 1.2, pal: "hotpink" },
      { x: 0.28, y: 0.45, size: 0.76, rot: 0.5, tilt: 0.92, delay: 1.3, pal: "pink" },
      { x: 0.72, y: 0.45, size: 0.76, rot: 0.1, tilt: 0.92, delay: 1.4, pal: "crimson" },
      { x: 0.40, y: 0.53, size: 0.80, rot: 0.6, tilt: 0.94, delay: 1.5, pal: "red" },
      { x: 0.60, y: 0.53, size: 0.80, rot: 0.3, tilt: 0.94, delay: 1.6, pal: "hotpink" },
      { x: 0.21, y: 0.53, size: 0.58, rot: 0.9, tilt: 0.85, delay: 1.7, pal: "crimson" },
      { x: 0.79, y: 0.53, size: 0.58, rot: 0.2, tilt: 0.85, delay: 1.8, pal: "blush" },
      { x: 0.50, y: 0.62, size: 0.68, rot: 0.4, tilt: 0.92, delay: 1.9, pal: "pink" },
      { x: 0.33, y: 0.61, size: 0.64, rot: 0.7, tilt: 0.88, delay: 2.0, pal: "hotpink" },
      { x: 0.67, y: 0.61, size: 0.64, rot: 0.0, tilt: 0.88, delay: 2.1, pal: "red" }
    ];

    function quadPt(t, p0, p1, p2) {
      const inv = 1 - t;
      return inv * inv * p0 + 2 * inv * t * p1 + t * t * p2;
    }

    function drawStem(tx, ty, bx, by, sway, prog, scaleK) {
      if (prog <= 0) return { tipX: bx, tipY: by };
      const fcx = (tx + bx) / 2 + sway * 16, fcy = (ty + by) / 2;
      const tipX = quadPt(prog, bx, fcx, tx), tipY = quadPt(prog, by, fcy, ty);
      const ccx = (tipX + bx) / 2 + sway * 16 * prog, ccy = (tipY + by) / 2;

      bctx.lineCap = "round";
      bctx.beginPath();
      bctx.moveTo(bx, by);
      bctx.quadraticCurveTo(ccx, ccy, tipX, tipY);
      bctx.strokeStyle = "#1f6a2c";
      bctx.lineWidth = 7 * scaleK;
      bctx.stroke();
      bctx.setLineDash([3 * scaleK, 5 * scaleK]);
      bctx.strokeStyle = "#7fd47f";
      bctx.lineWidth = 3 * scaleK;
      bctx.stroke();
      bctx.setLineDash([]);

      const leafG = easeOut(clamp01((prog - 0.45) / 0.55));
      if (leafG > 0) {
        const lx = quadPt(0.4, bx, fcx, tx), ly = quadPt(0.4, by, fcy, ty);
        const dir = tx < bx ? -1 : 1;
        bctx.save();
        bctx.translate(lx, ly);
        bctx.rotate(dir * (0.25 + 0.4 * leafG) + sway * 0.1);
        bctx.scale(leafG * scaleK, leafG * scaleK);
        bctx.beginPath();
        bctx.moveTo(0, 0);
        bctx.quadraticCurveTo(dir * 40, -24, dir * 84, 6);
        bctx.quadraticCurveTo(dir * 40, 20, 0, 0);
        const lg = bctx.createLinearGradient(0, 0, dir * 84, 0);
        lg.addColorStop(0, "#1b4d22");
        lg.addColorStop(0.6, "#35a042");
        lg.addColorStop(1, "#8ce089");
        bctx.fillStyle = lg;
        bctx.fill();
        bctx.strokeStyle = "#a6f0a0";
        bctx.lineWidth = 2;
        bctx.stroke();
        bctx.restore();
      }
      return { tipX, tipY };
    }

    // Rounded, cupped rose petal pointing "up" from the origin
    function roundPetalPath(l, w) {
      bctx.beginPath();
      bctx.moveTo(-w * 0.35, 0);
      bctx.bezierCurveTo(-w * 1.5, -l * 0.15, -w * 1.5, -l * 1.0, 0, -l);
      bctx.bezierCurveTo(w * 1.5, -l * 1.0, w * 1.5, -l * 0.15, w * 0.35, 0);
      bctx.closePath();
    }

    function drawRosePetal(l, w, pal) {
      const [c1, c2, c3] = pal.body;
      const g = bctx.createLinearGradient(0, 0, 0, -l);
      g.addColorStop(0, c1);
      g.addColorStop(0.55, c2);
      g.addColorStop(1, c3);
      roundPetalPath(l, w);
      bctx.fillStyle = g;
      bctx.fill();

      bctx.save();
      roundPetalPath(l, w);
      bctx.clip();
      // curved chenille ridges following the cup of the petal
      let flip = false;
      for (let k = 0.08; k < 1.05; k += 0.07) {
        const y = -l * k;
        const bow = 4 + 5 * k;
        bctx.beginPath();
        bctx.moveTo(-w * 1.6, y + bow);
        bctx.quadraticCurveTo(0, y - bow, w * 1.6, y + bow);
        bctx.strokeStyle = flip ? "rgba(255,255,255,0.22)" : "rgba(0,0,0,0.18)";
        bctx.lineWidth = 2.4;
        bctx.stroke();
        flip = !flip;
      }
      const sh = bctx.createLinearGradient(0, 0, 0, -l * 0.5);
      sh.addColorStop(0, "rgba(0,0,0,0.4)");
      sh.addColorStop(1, "rgba(0,0,0,0)");
      bctx.fillStyle = sh;
      bctx.fillRect(-w * 1.6, -l * 0.5, w * 3.2, l * 0.5);
      bctx.restore();

      roundPetalPath(l, w);
      bctx.lineJoin = "round";
      bctx.strokeStyle = pal.rim;
      bctx.lineWidth = 5;
      bctx.stroke();
      roundPetalPath(l, w);
      bctx.setLineDash([2, 3]);
      bctx.strokeStyle = "rgba(255,255,255,0.35)";
      bctx.lineWidth = 2;
      bctx.stroke();
      bctx.setLineDash([]);
    }

    // Coiled pipe-cleaner spiral at the heart of the rose
    function drawSpiral(prog, pal) {
      if (prog <= 0) return;
      const turns = 3.2 * prog;
      const maxR = 16;
      bctx.lineCap = "round";
      bctx.lineJoin = "round";
      for (let pass = 0; pass < 2; pass++) {
        bctx.beginPath();
        for (let t = 0; t <= turns * Math.PI * 2; t += 0.15) {
          const r = 1.5 + (t / (3.2 * Math.PI * 2)) * maxR;
          const px = Math.cos(t) * r, py = Math.sin(t) * r * 0.9;
          if (t === 0) bctx.moveTo(px, py); else bctx.lineTo(px, py);
        }
        bctx.strokeStyle = pass === 0 ? pal.core : pal.body[1];
        bctx.lineWidth = pass === 0 ? 7 : 4;
        bctx.stroke();
      }
      bctx.beginPath();
      for (let t = 0; t <= turns * Math.PI * 2; t += 0.15) {
        const r = 1.5 + (t / (3.2 * Math.PI * 2)) * maxR;
        const px = Math.cos(t) * r, py = Math.sin(t) * r * 0.9;
        if (t === 0) bctx.moveTo(px, py); else bctx.lineTo(px, py);
      }
      bctx.setLineDash([2, 3]);
      bctx.strokeStyle = pal.rim;
      bctx.lineWidth = 2;
      bctx.stroke();
      bctx.setLineDash([]);
    }

    // Layers of petals, outer to inner. Outer layers open first.
    const LAYERS = [
      { n: 6, dist: 22, len: 52, wid: 26, off: 0.0 },
      { n: 5, dist: 15, len: 42, wid: 23, off: 0.5 },
      { n: 4, dist: 9,  len: 32, wid: 19, off: 0.2 },
      { n: 3, dist: 4,  len: 22, wid: 15, off: 0.9 }
    ];

    function drawRose(x, y, size, rot, tilt, pal, openT, budG, sway) {
      if (budG <= 0) return;
      bctx.save();
      bctx.translate(x, y);
      bctx.rotate(rot + sway * 0.06);
      bctx.scale(tilt, tilt * 0.9 + 0.1);
      bctx.scale(size * budG, size * budG);

      const P = PAL[pal];

      // draw layers: outermost first so inner ones sit on top
      LAYERS.forEach((L, li) => {
        const pe = clamp01((openT - li * 0.14) / 0.6);
        const e = clamp01(easeOutBack(pe));
        const twist = (1 - pe) * 0.7 * (li % 2 ? -1 : 1);
        for (let i = 0; i < L.n; i++) {
          const a = L.off + (i * 2 * Math.PI) / L.n + twist;
          bctx.save();
          bctx.rotate(a);
          bctx.translate(0, -L.dist * e);
          // tight cup when closed, splayed when open
          bctx.rotate((1 - e) * (i % 2 ? 0.25 : -0.25));
          drawRosePetal(L.len * (0.45 + 0.55 * e), L.wid * (0.5 + 0.5 * e), P);
          bctx.restore();
        }
      });

      drawSpiral(easeOut(clamp01((openT - 0.3) / 0.6)), P);
      bctx.restore();
    }

    function render(now) {
      const elapsed = (now - startTime) / 1000;
      const swayTime = now * 0.0014;
      const scaleK = Math.min(width / 800, height / 900);
      bctx.fillStyle = "#000000";
      bctx.fillRect(0, 0, width, height);

      const bx = width * 0.5, by = height * 0.84;
      const states = bouquet.map((f, idx) => {
        const lt = Math.max(0, elapsed - f.delay);
        const stemP = easeInOut(clamp01(lt / 1.2));
        const budG = easeOut(clamp01((lt - 0.8) / 0.5));
        const openT = clamp01((lt - 1.2) / 1.8);
        const sway = Math.sin(swayTime + idx * 0.5) * stemP;
        return { f, stemP, budG, openT, sway, idx };
      });

      const tips = states.map((s) =>
        drawStem(width * s.f.x, height * s.f.y, bx, by, s.sway, s.stemP, scaleK)
      );

      const sorted = [...states].sort((a, b) => b.f.y - a.f.y);
      sorted.forEach((s) => {
        const t = tips[s.idx];
        drawRose(t.tipX, t.tipY, s.f.size * scaleK * 1.25, s.f.rot, s.f.tilt, s.f.pal, s.openT, s.budG, s.sway);
      });

      if (!asciiMode) {
        ctx.drawImage(buffer, 0, 0);
        requestAnimationFrame(render);
        return;
      }

      const data = bctx.getImageData(0, 0, width, height).data;
      ctx.fillStyle = "#050507";
      ctx.fillRect(0, 0, width, height);
      ctx.font = `bold ${CELL + 3}px monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (let y = 0; y < height; y += CELL) {
        for (let x = 0; x < width; x += CELL) {
          const sx = Math.min(width - 1, x + (CELL >> 1));
          const sy = Math.min(height - 1, y + (CELL >> 1));
          const i = (sy * width + sx) * 4;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          if (lum > 0.02) {
            const ci = Math.min(ASCII_CHARS.length - 1, Math.floor(Math.pow(lum, 0.8) * ASCII_CHARS.length));
            ctx.fillStyle = `rgb(${Math.min(255, r * 1.2)}, ${Math.min(255, g * 1.2)}, ${Math.min(255, b * 1.2)})`;
            ctx.fillText(ASCII_CHARS[ci], x + CELL / 2, y + CELL / 2);
          }
        }
      }
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
